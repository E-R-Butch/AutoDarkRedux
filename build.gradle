// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        ver_appcompat = '1.7.0'
        ver_activity = '1.9.3'
        ver_core = '1.13.1'
        ver_glide = '4.16.0'
        ver_gradle = '8.7.3'
        ver_hiddenapi = '4.3'
        ver_leak = "2.8.1"
        ver_license ="1.0.0"
        ver_lifecycle_extensions = "2.8.7"
        ver_kotlin = '2.0.20'
        ver_kotlin_coroutines = "1.8.1"
        ver_material = "1.12.0"
        ver_navigation = '2.1.0-beta02'
        ver_preference = "1.2.1"
        ver_rikka_design = "3.1.8"
        ver_sunrise_cal = "1.2"
        ver_timber = "5.0.1"
        ver_junit = "4.13.2"
        ver_xposed = "82"

        // Shizuku manifest
        apply from: 'Shizuku-API/manifest.gradle'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$ver_gradle"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$ver_kotlin"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://api.xposed.info/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
